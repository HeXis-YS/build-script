name: Build & Release

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build all (single script)
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          bash build.sh

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0
          body_path: /tmp/build-script/version.json
          files: |
            /tmp/build-script/dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
